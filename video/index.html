<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Triagent · Full Demo Reel (2:50)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0e13; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="170"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="host-intro"
        class="clip"
        data-composition-id="triagent-intro"
        data-composition-src="./compositions/intro.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>
      <div
        id="host-demo"
        class="clip"
        data-composition-id="triagent-demo"
        data-composition-src="./compositions/demo.html"
        data-start="5"
        data-duration="155"
        data-track-index="0"
      ></div>
      <div
        id="host-outro"
        class="clip"
        data-composition-id="triagent-outro"
        data-composition-src="./compositions/outro.html"
        data-start="160"
        data-duration="10"
        data-track-index="0"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
