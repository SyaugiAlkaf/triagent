<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Triagent · Intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0e13; }
    </style>
  </head>
  <body>
    <div
      id="triagent-intro"
      data-composition-id="triagent-intro"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="5"
    >
      <div class="stage">
        <div class="grid"></div>
        <div class="vignette"></div>

        <div class="brand-stamp tl">TRIAGENT v0.4.2 · BUILD 8c2f1a</div>
        <div class="brand-stamp tr">DEVNETWORK [AI+ML] 2026</div>
        <div class="brand-stamp bl">SRE WAR ROOM</div>
        <div class="brand-stamp br">RESILIENT AGENTS TRACK</div>

        <div class="center">
          <div class="mark">
            <svg viewBox="0 0 14 14" width="120" height="120">
              <path d="M2 11 L7 2 L12 11" stroke="#a259ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <circle cx="7" cy="8.5" r="1.3" fill="#a259ff" />
            </svg>
          </div>
          <h1 class="wordmark">TRIAGENT</h1>
          <div class="rule"></div>
          <p class="tagline">Resilient K8s incident agent</p>
          <p class="subtagline">TrueFoundry Resilient Agents track · DevNetwork [AI+ML] 2026</p>
        </div>

        <div class="scan-bar"></div>
      </div>

      <style>
        #triagent-intro .stage {
          width: 1920px; height: 1080px; position: relative; overflow: hidden;
          background: #0b0e13;
          font-family: 'Inter', sans-serif;
          color: #c4ccd9;
        }
        #triagent-intro .grid {
          position: absolute; inset: 0; pointer-events: none;
          background-image:
            linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
          background-size: 96px 96px, 96px 96px;
          opacity: 0;
        }
        #triagent-intro .vignette {
          position: absolute; inset: 0; pointer-events: none;
          background: radial-gradient(ellipse at center, rgba(11,14,19,0) 30%, rgba(11,14,19,0.85) 95%);
          opacity: 0;
        }
        #triagent-intro .brand-stamp {
          position: absolute;
          font-family: 'JetBrains Mono', ui-monospace, monospace;
          font-size: 18px;
          letter-spacing: 0.18em;
          color: #6b7484;
          opacity: 0;
        }
        #triagent-intro .brand-stamp.tl { top: 40px; left: 56px; }
        #triagent-intro .brand-stamp.tr { top: 40px; right: 56px; }
        #triagent-intro .brand-stamp.bl { bottom: 40px; left: 56px; }
        #triagent-intro .brand-stamp.br { bottom: 40px; right: 56px; }

        #triagent-intro .center {
          position: absolute;
          left: 50%; top: 50%;
          transform: translate(-50%, -50%);
          width: 1100px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #triagent-intro .mark {
          width: 168px; height: 168px;
          display: grid; place-items: center;
          background: #0a0d12;
          border: 1.5px solid rgba(162, 89, 255, 0.45);
          border-radius: 28px;
          margin-bottom: 36px;
          opacity: 0;
          box-shadow: 0 0 60px -10px rgba(162, 89, 255, 0.28);
        }
        #triagent-intro .wordmark {
          font-family: 'JetBrains Mono', ui-monospace, monospace;
          font-size: 132px;
          font-weight: 700;
          letter-spacing: 0.18em;
          color: #f2f5fa;
          line-height: 1;
          opacity: 0;
        }
        #triagent-intro .rule {
          margin-top: 28px;
          width: 0;
          height: 1.5px;
          background: linear-gradient(90deg, transparent, #a259ff, transparent);
          opacity: 0;
        }
        #triagent-intro .tagline {
          margin-top: 26px;
          font-size: 34px;
          font-weight: 500;
          color: #c4ccd9;
          letter-spacing: 0.02em;
          opacity: 0;
        }
        #triagent-intro .subtagline {
          margin-top: 14px;
          font-family: 'JetBrains Mono', ui-monospace, monospace;
          font-size: 18px;
          letter-spacing: 0.16em;
          color: #9aa3b2;
          opacity: 0;
        }
        #triagent-intro .scan-bar {
          position: absolute;
          left: 0; right: 0; top: -2px; height: 2px;
          background: linear-gradient(90deg, transparent, rgba(162,89,255,0.85), transparent);
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const root = '#triagent-intro';

          tl.fromTo(`${root} .grid`,     { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.0);
          tl.fromTo(`${root} .vignette`, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.0);

          tl.fromTo(`${root} .scan-bar`,
            { opacity: 0, top: -2 },
            { opacity: 1, top: 1080, duration: 1.2, ease: "power2.inOut" }, 0.0);
          tl.to(`${root} .scan-bar`, { opacity: 0, duration: 0.2 }, 1.15);

          tl.fromTo(`${root} .mark`,
            { opacity: 0, scale: 0.85 },
            { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 0.45);

          tl.fromTo(`${root} .wordmark`,
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.75);

          tl.fromTo(`${root} .rule`,
            { opacity: 0, width: 0 },
            { opacity: 1, width: 540, duration: 0.6, ease: "power2.out" }, 1.20);

          tl.fromTo(`${root} .tagline`,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.45);

          tl.fromTo(`${root} .subtagline`,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.65);

          tl.fromTo(`${root} .brand-stamp.tl`, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.85);
          tl.fromTo(`${root} .brand-stamp.tr`, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.95);
          tl.fromTo(`${root} .brand-stamp.bl`, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.05);
          tl.fromTo(`${root} .brand-stamp.br`, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.15);

          tl.to(
            [
              `${root} .mark`,
              `${root} .wordmark`,
              `${root} .rule`,
              `${root} .tagline`,
              `${root} .subtagline`,
              `${root} .brand-stamp`,
              `${root} .grid`,
              `${root} .vignette`,
            ],
            { opacity: 0, duration: 0.5, ease: "power2.in" },
            4.5
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["triagent-intro"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
